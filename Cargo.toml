[workspace]
members = ["contracts/*"]
resolver = "2"

[workspace.package]
authors = ["ALevai"]
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Lokt-In/loktin"
version = "0.0.1"

[workspace.dependencies.soroban-sdk]
version = "23.0.2"

[workspace.dependencies.stellar-access]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.5.1"

# The pausable module for the `v0.5.1` line of stellar-contracts. On that tag it
# ships inside `stellar-contract-utils` (`stellar_contract_utils::pausable`),
# which is pinned to soroban-sdk 23 and therefore links against these contracts.
# Tags are per-package in that repo: `stellar-access` / `stellar-macros` were
# released on the `v0.5.1` line while the standalone `stellar-pausable` crate
# below only exists on the `v0.3.0` line, which is pinned to soroban-sdk 22 and
# cannot be linked from an soroban-sdk 23 contract. Unifying every OZ dependency
# onto one tag is tracked by #35; #39 only needs the pausable module that
# matches the `stellar-access` tag it already uses.
[workspace.dependencies.stellar-contract-utils]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.5.1"

[workspace.dependencies.stellar-default-impl-macro]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.3.0"

[workspace.dependencies.stellar-fungible]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.3.0"

[workspace.dependencies.stellar-macros]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.5.1"

[workspace.dependencies.stellar-non-fungible]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.3.0"

# soroban-sdk 22 line, unused by the contracts (see the note on
# `stellar-contract-utils` above).
[workspace.dependencies.stellar-pausable]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.3.0"

[workspace.dependencies.stellar-pausable-macros]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.3.0"

[workspace.dependencies.stellar-tokens]
git = "https://github.com/OpenZeppelin/stellar-contracts"
tag = "v0.5.1"

[profile.release]
opt-level = "z"
debug = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
overflow-checks = true
strip = true

[profile.release-with-logs]
debug-assertions = true
inherits = "release"
